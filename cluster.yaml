apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: toggle-master-cluster
  region: us-east-1

iam:
  withOIDC: true

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: toggle-master-nodes
    instanceType: c7i-flex.large
    minSize: 1
    desiredCapacity: 1
    maxSize: 2
    volumeSize: 20
    privateNetworking: false
